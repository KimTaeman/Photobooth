<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Splash Photobooth 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --sky: #BAE6FD;
            --white: #FFFFFF;
            --yellow: #FEF08A;
            --yellow-deep: #FACC15;
            --blue: #3B82F6;
            --blue-light: #60A5FA;
            --bg-gradient: radial-gradient(ellipse at 50% 30%, #FFF9DB 0%, #FEF9C3 25%, #FFFDF5 60%, #FFFFFF 100%);
            --glass: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 8px 32px rgba(59, 130, 246, 0.1);
            --text: #1E3A5F;
            --text-muted: #64748B;
            --success: #22c55e;
            --danger: #EF4444;
            --radius: 24px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            font-family: 'Nunito', 'Varela Round', system-ui, sans-serif;
            /* background: var(--bg-gradient); */
            background-image: url('background.png');
            background-size: cover;
            color: var(--text);
            overflow: hidden;
        }

        h1, h2, h3, .shot-label, .frame-label {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
        }

        /* ---- Shared Screen ---- */
        .screen {
            position: fixed; inset: 0; z-index: 10;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--bg-gradient);
            transition: opacity 0.4s ease;
        }
        .screen.active { display: flex; }

        /* ---- SVG Stickers ---- */
        .sticker {
            position: fixed; pointer-events: none; z-index: 55; opacity: 0.35;
        }
        .sticker-tl { top: 30px; left: 30px; }
        .sticker-tr { top: 30px; right: 30px; }
        .sticker-bl { bottom: 30px; left: 30px; }
        .sticker-br { bottom: 30px; right: 30px; }
        .sticker-ml { top: 50%; left: 20px; transform: translateY(-50%); }
        .sticker-mr { top: 50%; right: 20px; transform: translateY(-50%); }

        /* ---- Glassmorphism Panel ---- */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
        }

        /* ---- Buttons ---- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 32px; border-radius: 50px; border: none;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
        }
        .btn:hover { transform: scale(1.07); }
        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-deep) 100%);
            color: #92400E;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
        }
        .btn-primary:hover { box-shadow: 0 8px 30px rgba(250, 204, 21, 0.5); }

        .btn-blue {
            background: linear-gradient(135deg, var(--blue-light) 0%, var(--blue) 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35);
        }
        .btn-blue:hover { box-shadow: 0 8px 30px rgba(59, 130, 246, 0.45); }

        .btn-outline {
            background: var(--glass); color: var(--blue);
            border: 2px solid var(--sky);
            backdrop-filter: blur(10px);
        }
        .btn-outline:hover { border-color: var(--blue); background: rgba(186, 230, 253, 0.3); }

        .btn-lg { padding: 18px 48px; font-size: 1.2rem; }
        .btn-block { width: 100%; margin-top: 18px; }

        /* ---- Lock Screen ---- */
        #screen-lock {
            z-index: 50;
            background: url('background.png') center/cover no-repeat;
        }
        #screen-lock::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 0;
        }
        #screen-lock > * { position: relative; z-index: 1; }
        .lock-card {
            padding: 48px 44px; text-align: center; min-width: 380px;
        }
        .lock-splash-icon {
            width: 80px; height: 80px; margin: 0 auto 20px;
        }
        .lock-card h1 { font-size: 1.8rem; margin-bottom: 6px; color: var(--blue); }
        .lock-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .lock-input {
            width: 100%; padding: 14px 18px; border-radius: 16px;
            border: 2px solid var(--sky); background: rgba(255,255,255,0.8);
            color: var(--text); font-size: 1rem; outline: none;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .lock-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
        .lock-input.shake {
            animation: shake 0.4s ease;
            border-color: var(--danger);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .lock-error { color: var(--danger); font-size: 0.8rem; margin-top: 10px; min-height: 20px; font-weight: 600; }

        /* ---- Frame Selection ---- */
        #screen-frames { overflow-y: auto; padding: 40px 20px; }
        .frames-header { margin-bottom: 36px; text-align: center; }
        .frames-header h1 { font-size: 2.2rem; color: var(--blue); }
        .frames-header p { color: var(--text-muted); margin-top: 6px; font-size: 1rem; }

        .frames-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px; max-width: 700px; width: 90%;
        }
        .frame-card {
            position: relative; cursor: pointer;
            background: var(--white); border-radius: 20px;
            border: 6px solid var(--white);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), border-color 0.25s, box-shadow 0.25s;
            overflow: hidden;
        }
        .frame-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
        .frame-card.selected {
            border-color: var(--yellow-deep);
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.3), 0 12px 32px rgba(0,0,0,0.1);
        }
        .frame-card img {
            width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block;
            background: linear-gradient(135deg, #E0F2FE, #FEF9C3);
        }
        .frame-card .check {
            position: absolute; top: 12px; right: 12px;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--yellow-deep); color: #92400E;
            display: none; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .frame-card.selected .check { display: flex; }
        .frame-card .frame-label {
            padding: 14px 16px; font-weight: 700; font-size: 0.95rem;
            text-align: center; color: var(--text);
        }
        #btn-start-session {
            margin-top: 36px; opacity: 0.4; pointer-events: none;
            transition: opacity 0.3s;
        }
        #btn-start-session.ready { opacity: 1; pointer-events: auto; }

        /* ---- Camera Screen ---- */
        #screen-camera {
            background: linear-gradient(180deg, #F0F9FF 0%, #FFFBEB 100%);
            justify-content: flex-start; padding: 0;
        }
        .camera-topbar {
            width: 100%; padding: 16px 30px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 5;
        }
        .btn-back {
            background: var(--glass); border: 2px solid var(--sky);
            color: var(--blue); width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(10px);
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
        }
        .btn-back:hover { transform: scale(1.1); }
        .btn-back:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .shot-indicators { display: flex; gap: 10px; }
        .shot-dot {
            width: 16px; height: 16px; border-radius: 50%;
            background: rgba(59, 130, 246, 0.15); border: 2.5px solid var(--sky);
            transition: background 0.3s, border-color 0.3s;
        }
        .shot-dot.done { background: var(--success); border-color: var(--success); }
        .shot-dot.current { background: var(--blue); border-color: var(--blue); animation: pulse-dot 1s infinite; }
        @keyframes pulse-dot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
        .shot-label { font-weight: 700; font-size: 1rem; color: var(--blue); }

        .camera-viewport {
            flex: 1; width: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            padding: 10px;
        }
        #video-wrapper {
            position: relative; width: 88%; max-width: 860px;
            aspect-ratio: 3/2; border-radius: 24px; overflow: hidden;
            border: 12px solid var(--white);
            box-shadow: 0 12px 40px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.06);
            background: #E0F2FE;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #frame-overlay {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; display: none;
        }
        #countdown-overlay {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 200px; font-weight: 700; z-index: 20;
            background: rgba(255,255,255,0.35); color: var(--blue);
            text-shadow: 0 4px 30px rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(4px);
        }
        /* Ripple flash effect */
        #flash-overlay {
            position: absolute; z-index: 30; pointer-events: none;
            width: 0; height: 0; border-radius: 50%;
            background: radial-gradient(circle, rgba(186,230,253,0.8) 0%, rgba(186,230,253,0) 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0;
        }
        #flash-overlay.ripple {
            animation: ripple-flash 0.6s ease-out forwards;
        }
        @keyframes ripple-flash {
            0% { width: 0; height: 0; opacity: 1; }
            50% { opacity: 0.8; }
            100% { width: 250%; height: 250%; opacity: 0; }
        }

        .camera-bottom {
            width: 100%; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        #camera-status {
            color: var(--text-muted); font-weight: 700; margin-bottom: 16px;
            font-size: 1.1rem; font-family: 'Fredoka', sans-serif;
        }
        .shutter-btn {
            width: 84px; height: 84px; border-radius: 50%;
            background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-deep) 100%);
            border: 5px solid var(--white);
            box-shadow: 0 6px 24px rgba(250, 204, 21, 0.4);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .shutter-btn:hover { transform: scale(1.1); box-shadow: 0 8px 30px rgba(250, 204, 21, 0.5); }
        .shutter-btn:active { transform: scale(0.92); }
        .shutter-btn:disabled {
            background: #CBD5E1; cursor: not-allowed; border-color: #E2E8F0;
            box-shadow: none;
        }
        .shutter-icon { width: 36px; height: 36px; fill: #92400E; }

        /* ---- Result Screen ---- */
        #screen-result {
            background: var(--bg-gradient);
            padding: 40px 20px; overflow-y: auto;
        }
        .result-content {
            display: flex; flex-direction: column; align-items: center;
            gap: 28px; max-width: 800px; width: 100%;
        }
        .result-header { text-align: center; }
        .result-header h1 { font-size: 2.2rem; color: var(--blue); }
        .result-header p { color: var(--text-muted); margin-top: 6px; font-size: 1rem; }
        .result-photo {
            width: 100%; max-width: 600px; border-radius: 20px;
            overflow: hidden; border: 10px solid var(--white);
            box-shadow: 0 16px 48px rgba(0,0,0,0.1);
            background: linear-gradient(135deg, #E0F2FE, #FEF9C3);
        }
        .result-photo img { width: 100%; display: block; }
        .result-actions {
            display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
        }
        .qr-section {
            border-radius: 24px; padding: 28px; text-align: center;
        }
        .qr-section p { color: var(--text-muted); font-size: 0.85rem; margin-top: 10px; }
        .qr-box {
            background: white; padding: 14px; border-radius: 16px;
            display: inline-block; margin-top: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .expiry-note {
            color: var(--blue-light); font-size: 0.78rem;
            margin-top: 6px; font-weight: 600;
        }

        /* ---- Upload Spinner ---- */
        .upload-overlay {
            position: fixed; inset: 0; z-index: 60;
            display: none; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            flex-direction: column; gap: 20px;
        }
        .upload-overlay.active { display: flex; }
        .spinner {
            width: 56px; height: 56px; border-radius: 50%;
            border: 5px solid var(--sky);
            border-top-color: var(--blue);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .upload-overlay p { color: var(--text-muted); font-weight: 700; font-size: 1.1rem; font-family: 'Fredoka', sans-serif; }

        /* ---- Image placeholder fallback ---- */
        .frame-card img[src=""], .frame-card img:not([src]) {
            background: linear-gradient(135deg, #E0F2FE 0%, #FEF9C3 100%);
        }

        /* ---- Performance hints ---- */
        .screen { contain: layout style; }
        video { will-change: transform; }
        #countdown-overlay { will-change: opacity, contents; }
        .shutter-btn, .btn, .frame-card { will-change: transform; }
    </style>
</head>
<body>

    <!-- SVG Stickers scattered in corners -->
    <!-- Water splash top-left -->
    <svg class="sticker sticker-tl" width="80" height="80" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="20" fill="#BAE6FD"/>
        <ellipse cx="30" cy="30" rx="8" ry="12" transform="rotate(-30 30 30)" fill="#BAE6FD"/>
        <ellipse cx="70" cy="25" rx="6" ry="10" transform="rotate(20 70 25)" fill="#BAE6FD"/>
        <ellipse cx="75" cy="65" rx="7" ry="11" transform="rotate(40 75 65)" fill="#BAE6FD"/>
        <ellipse cx="25" cy="70" rx="6" ry="9" transform="rotate(-20 25 70)" fill="#BAE6FD"/>
        <circle cx="50" cy="15" r="5" fill="#60A5FA"/>
        <circle cx="15" cy="50" r="4" fill="#60A5FA"/>
        <circle cx="85" cy="45" r="4" fill="#60A5FA"/>
    </svg>

    <!-- Cat top-right -->
    <svg class="sticker sticker-tr" width="70" height="70" viewBox="0 0 100 100" fill="none">
        <ellipse cx="50" cy="58" rx="28" ry="24" fill="#FEF08A"/>
        <polygon points="28,42 22,18 40,34" fill="#FEF08A"/>
        <polygon points="72,42 78,18 60,34" fill="#FEF08A"/>
        <polygon points="28,42 22,18 40,34" fill="none" stroke="#FACC15" stroke-width="2"/>
        <polygon points="72,42 78,18 60,34" fill="none" stroke="#FACC15" stroke-width="2"/>
        <circle cx="40" cy="52" r="4" fill="#1E3A5F"/>
        <circle cx="60" cy="52" r="4" fill="#1E3A5F"/>
        <ellipse cx="50" cy="60" rx="3" ry="2" fill="#F9A8D4"/>
        <path d="M44 64 Q50 70 56 64" stroke="#1E3A5F" stroke-width="2" fill="none" stroke-linecap="round"/>
        <line x1="20" y1="55" x2="35" y2="58" stroke="#FACC15" stroke-width="1.5"/>
        <line x1="20" y1="60" x2="35" y2="60" stroke="#FACC15" stroke-width="1.5"/>
        <line x1="65" y1="58" x2="80" y2="55" stroke="#FACC15" stroke-width="1.5"/>
        <line x1="65" y1="60" x2="80" y2="60" stroke="#FACC15" stroke-width="1.5"/>
    </svg>

    <!-- Water drop bottom-left -->
    <svg class="sticker sticker-bl" width="60" height="70" viewBox="0 0 60 80" fill="none">
        <path d="M30 5 Q30 5 10 45 Q10 65 30 75 Q50 65 50 45 Q30 5 30 5Z" fill="#BAE6FD" stroke="#60A5FA" stroke-width="2"/>
        <ellipse cx="24" cy="48" rx="6" ry="8" fill="rgba(255,255,255,0.5)" transform="rotate(-15 24 48)"/>
    </svg>

    <!-- Water gun bottom-right -->
    <svg class="sticker sticker-br" width="90" height="60" viewBox="0 0 120 80" fill="none">
        <rect x="10" y="30" width="60" height="20" rx="6" fill="#60A5FA"/>
        <rect x="60" y="25" width="40" height="12" rx="4" fill="#3B82F6"/>
        <rect x="95" y="22" width="20" height="18" rx="3" fill="#BAE6FD" stroke="#3B82F6" stroke-width="2"/>
        <rect x="30" y="48" width="14" height="22" rx="4" fill="#60A5FA"/>
        <circle cx="22" cy="40" r="6" fill="#BAE6FD"/>
        <line x1="115" y1="28" x2="118" y2="24" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>
        <line x1="115" y1="31" x2="120" y2="31" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>
        <line x1="115" y1="35" x2="118" y2="38" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <!-- Splash middle-left -->
    <svg class="sticker sticker-ml" width="50" height="50" viewBox="0 0 60 60" fill="none">
        <circle cx="30" cy="30" r="12" fill="#FEF08A"/>
        <circle cx="30" cy="10" r="5" fill="#FEF08A"/>
        <circle cx="10" cy="30" r="5" fill="#FEF08A"/>
        <circle cx="50" cy="30" r="5" fill="#FEF08A"/>
        <circle cx="30" cy="50" r="5" fill="#FEF08A"/>
        <circle cx="15" cy="15" r="4" fill="#FEF08A"/>
        <circle cx="45" cy="15" r="4" fill="#FEF08A"/>
        <circle cx="15" cy="45" r="4" fill="#FEF08A"/>
        <circle cx="45" cy="45" r="4" fill="#FEF08A"/>
    </svg>

    <!-- Small drops middle-right -->
    <svg class="sticker sticker-mr" width="50" height="70" viewBox="0 0 50 70" fill="none">
        <path d="M15 10 Q15 10 8 25 Q6 33 15 37 Q24 33 22 25Z" fill="#BAE6FD"/>
        <path d="M35 25 Q35 25 28 40 Q26 48 35 52 Q44 48 42 40Z" fill="#60A5FA" opacity="0.5"/>
        <path d="M18 45 Q18 45 13 55 Q12 60 18 63 Q24 60 23 55Z" fill="#BAE6FD" opacity="0.7"/>
    </svg>


    <!-- SCREEN 1: Lock -->
    <div id="screen-lock" class="screen active">
        <div class="lock-card glass-card">
            <!-- Water Splash SVG icon -->
            <svg class="lock-splash-icon" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="24" fill="#BAE6FD"/>
                <ellipse cx="30" cy="28" rx="9" ry="14" transform="rotate(-30 30 28)" fill="#BAE6FD"/>
                <ellipse cx="72" cy="24" rx="7" ry="12" transform="rotate(25 72 24)" fill="#BAE6FD"/>
                <ellipse cx="76" cy="68" rx="8" ry="13" transform="rotate(35 76 68)" fill="#BAE6FD"/>
                <ellipse cx="24" cy="72" rx="7" ry="11" transform="rotate(-25 24 72)" fill="#BAE6FD"/>
                <circle cx="50" cy="12" r="6" fill="#60A5FA"/>
                <circle cx="12" cy="50" r="5" fill="#60A5FA"/>
                <circle cx="88" cy="44" r="5" fill="#60A5FA"/>
                <circle cx="50" cy="88" r="5" fill="#60A5FA"/>
                <circle cx="50" cy="50" r="12" fill="rgba(255,255,255,0.4)"/>
            </svg>
            <h1>Photobooth</h1>
            <p>Enter password to unlock the booth</p>
            <input type="password" id="pass-input" class="lock-input" placeholder="Password" autocomplete="off">
            <div id="lock-error" class="lock-error"></div>
            <button class="btn btn-primary btn-block" id="btn-unlock">&#x1F513; Unlock</button>
        </div>
    </div>

    <!-- SCREEN 2: Frame Selection -->
    <div id="screen-frames" class="screen">
        <div class="frames-header">
            <h1>&#x1F3A8; Choose Your Frame</h1>
            <p>Pick a frame for your photo strip!</p>
        </div>
        <div class="frames-grid" id="frames-grid">
            <div class="frame-card" data-frame="frame1.png">
                <img src="frame1.png" alt="Frame 1" onerror="this.style.minHeight='180px'">
                <div class="check">&#10003;</div>
                <div class="frame-label">Frame 1</div>
            </div>
            <div class="frame-card" data-frame="frame2.png">
                <img src="frame2.png" alt="Frame 2" onerror="this.style.minHeight='180px'">
                <div class="check">&#10003;</div>
                <div class="frame-label">Frame 2</div>
            </div>
        </div>
        <button class="btn btn-primary btn-lg" id="btn-start-session">&#x1F4F7; Start Photo Session</button>
    </div>

    <!-- SCREEN 3: Camera -->
    <div id="screen-camera" class="screen">
        <div class="camera-topbar">
            <button class="btn-back" id="btn-back" title="Back to frames">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="shot-indicators" id="shot-indicators">
                <div class="shot-dot" data-shot="1"></div>
                <div class="shot-dot" data-shot="2"></div>
                <div class="shot-dot" data-shot="3"></div>
                <div class="shot-dot" data-shot="4"></div>
            </div>
            <div class="shot-label" id="shot-label">Shot 1 / 4</div>
        </div>
        <div class="camera-viewport">
            <div id="video-wrapper">
                <div id="countdown-overlay">3</div>
                <div id="flash-overlay"></div>
                <video id="webcam" autoplay playsinline></video>
                <img id="frame-overlay">
            </div>
        </div>
        <div class="camera-bottom">
            <div id="camera-status">Get ready and press the button!</div>
            <button class="shutter-btn" id="shutter-btn">
                <svg class="shutter-icon" viewBox="0 0 24 24">
                    <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/>
                    <path d="M9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- SCREEN 4: Result -->
    <div id="screen-result" class="screen">
        <div class="result-content">
            <div class="result-header">
                <h1>&#x1F389; Your Photo!</h1>
                <p>Scan the QR code or tap download</p>
            </div>
            <div class="result-photo">
                <img id="result-img" src="" alt="Your photo">
            </div>
            <div class="qr-section glass-card">
                <div class="qr-box">
                    <canvas id="canvas-qr"></canvas>
                </div>
                <p>Scan to download your photo</p>
                <p class="expiry-note">&#9200; Link expires in 24 hours</p>
            </div>
            <div class="result-actions">
                <button class="btn btn-blue btn-lg" id="btn-download">&#11015; Download</button>
                <button class="btn btn-outline btn-lg" id="btn-new-session">&#x1F504; New Session</button>
            </div>
        </div>
    </div>

    <!-- Upload Spinner Overlay -->
    <div class="upload-overlay" id="upload-overlay">
        <div class="spinner"></div>
        <p id="upload-status">Uploading photo...</p>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

<script>
    // ---- Supabase Config (anon key — safe for client-side; secure via Supabase RLS policies) ----
    const _s = [
        'aHR0cHM6Ly95emVvcmZ5Z211Ymd5dWtleXBzeC5zdXBhYmFzZS5jbw==',
        'ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW5sNlpXOXlabmxuYlhWaVozbDFhMlY1Y0hONElpd2ljbTlzWlNJNkltRnViMjRpTENKcFlYUWlPakUzTnpNeU1EazBNVFVzSW1WNGNDSTZNakE0T0RjNE5UUXhOWDAuS1M2Y2JjMy1VME1JLVYzQS04c2FZUUZUTkVhNWdCbkdFR21QcUdzSlZudw=='
    ];
    const SUPABASE_URL = atob(_s[0]);
    const SUPABASE_ANON_KEY = atob(_s[1]);
    const STORAGE_BUCKET = 'photos';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Password stored as SHA-256 hash (never in plaintext)
    const PASSWORD_HASH = '9cb4b10ff9c97ada0fc9cdc5c8fd6992c6d5d707fa2565f951aa7762d8a5f4e7';
    let selectedFrame = null;
    let sessionPhotos = [];  // stores Blob objects instead of data URLs
    let isProcessing = false;
    let cameraStream = null;

    // ---- Cached DOM Elements ----
    const $screens = document.querySelectorAll('.screen');
    const $passInput = document.getElementById('pass-input');
    const $lockError = document.getElementById('lock-error');
    const $btnUnlock = document.getElementById('btn-unlock');
    const $framesGrid = document.getElementById('frames-grid');
    const $frameCards = document.querySelectorAll('.frame-card');
    const $btnStartSession = document.getElementById('btn-start-session');
    const $btnBack = document.getElementById('btn-back');
    const $shutterBtn = document.getElementById('shutter-btn');
    const $video = document.getElementById('webcam');
    const $frameOverlay = document.getElementById('frame-overlay');
    const $countdownOverlay = document.getElementById('countdown-overlay');
    const $flashOverlay = document.getElementById('flash-overlay');
    const $shotLabel = document.getElementById('shot-label');
    const $cameraStatus = document.getElementById('camera-status');
    const $shotDots = document.querySelectorAll('.shot-dot');
    const $hiddenCanvas = document.getElementById('hidden-canvas');
    const $resultImg = document.getElementById('result-img');
    const $canvasQR = document.getElementById('canvas-qr');
    const $uploadOverlay = document.getElementById('upload-overlay');
    const $uploadStatus = document.getElementById('upload-status');
    const $btnDownload = document.getElementById('btn-download');
    const $btnNewSession = document.getElementById('btn-new-session');

    // Reusable capture canvas (avoid re-creating per shot)
    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d');

    // ---- Screen Navigation ----
    function showScreen(id) {
        $screens.forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // ---- SHA-256 Utility ----
    async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ---- 1. Lock Screen ----
    $btnUnlock.addEventListener('click', handleUnlock);
    $passInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleUnlock(); });

    async function handleUnlock() {
        const hash = await sha256($passInput.value);
        if (hash === PASSWORD_HASH) {
            showScreen('screen-frames');
        } else {
            $lockError.textContent = 'Incorrect password';
            $passInput.classList.add('shake');
            $passInput.value = '';
            $passInput.focus();
            setTimeout(() => $passInput.classList.remove('shake'), 400);
        }
    }

    // ---- 2. Frame Selection (event delegation) ----
    $framesGrid.addEventListener('click', (e) => {
        const card = e.target.closest('.frame-card');
        if (!card) return;
        $frameCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedFrame = card.dataset.frame;
        $btnStartSession.classList.add('ready');
    });

    $btnStartSession.addEventListener('click', async () => {
        if (!selectedFrame) return;
        await startCamera();
        $frameOverlay.src = selectedFrame;
        $frameOverlay.style.display = 'block';
        resetShotIndicators();
        showScreen('screen-camera');
    });

    // ---- 3. Camera ----
    async function startCamera() {
        if (cameraStream) return;
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
            });
            $video.srcObject = cameraStream;
        } catch (err) {
            alert("Camera error: " + err.message);
        }
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
            $video.srcObject = null;
        }
    }

    function resetShotIndicators() {
        $shotDots.forEach(d => d.classList.remove('done', 'current'));
        $shotDots[0].classList.add('current');
        $shotLabel.textContent = 'Shot 1 / 4';
        $cameraStatus.textContent = 'Get ready and press the button!';
    }

    function updateShotUI(shotNum) {
        $shotDots.forEach(d => {
            const n = parseInt(d.dataset.shot);
            d.classList.remove('done', 'current');
            if (n < shotNum) d.classList.add('done');
            else if (n === shotNum) d.classList.add('current');
        });
        $shotLabel.textContent = `Shot ${shotNum} / 4`;
    }

    $btnBack.addEventListener('click', () => {
        if (isProcessing) return;
        stopCamera();
        $frameOverlay.style.display = 'none';
        showScreen('screen-frames');
    });

    $shutterBtn.addEventListener('click', startPhotoSession);

    async function startPhotoSession() {
        if (isProcessing) return;
        isProcessing = true;
        $shutterBtn.disabled = true;
        // Free previous session blobs
        sessionPhotos.forEach(url => { if (typeof url === 'string' && url.startsWith('blob:')) URL.revokeObjectURL(url); });
        sessionPhotos = [];

        for (let i = 1; i <= 4; i++) {
            updateShotUI(i);
            $cameraStatus.textContent = `Pose! Shot ${i} of 4`;
            await runCountdown();
            await captureCurrentFrame();
            triggerFlash();
            $shotDots[i - 1].classList.remove('current');
            $shotDots[i - 1].classList.add('done');
            if (i < 4) await new Promise(r => setTimeout(r, 1200));
        }

        $cameraStatus.textContent = 'Processing...';
        await processAndShow();
        stopCamera();
        isProcessing = false;
        $shutterBtn.disabled = false;
    }

    function runCountdown() {
        return new Promise(resolve => {
            let count = 3;
            $countdownOverlay.style.display = 'flex';
            $countdownOverlay.textContent = count;
            const timer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    $countdownOverlay.style.display = 'none';
                    resolve();
                } else {
                    $countdownOverlay.textContent = count;
                }
            }, 800);
        });
    }

    function triggerFlash() {
        $flashOverlay.classList.remove('ripple');
        void $flashOverlay.offsetWidth;
        $flashOverlay.classList.add('ripple');
        $flashOverlay.addEventListener('animationend', () => {
            $flashOverlay.classList.remove('ripple');
        }, { once: true });
    }

    function captureCurrentFrame() {
        const w = $video.videoWidth;
        const h = $video.videoHeight;
        captureCanvas.width = w;
        captureCanvas.height = h;
        captureCtx.setTransform(-1, 0, 0, 1, w, 0);
        captureCtx.drawImage($video, 0, 0);
        captureCtx.setTransform(1, 0, 0, 1, 0, 0);
        // Store as blob URL to save memory vs base64 data URLs
        return new Promise(resolve => {
            captureCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                sessionPhotos.push(url);
                resolve();
            }, 'image/jpeg', 0.92);
        });
    }

    // ---- 4. Process & Result ----
    async function processAndShow() {
        const ctx = $hiddenCanvas.getContext('2d');

        $hiddenCanvas.width = 1800;
        $hiddenCanvas.height = 1200;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1800, 1200);

        const coords = [
            { x: 40, y: 40 }, { x: 920, y: 40 },
            { x: 40, y: 620 }, { x: 920, y: 620 }
        ];

        // Load all 4 photos in parallel
        const photoImgs = await Promise.all(sessionPhotos.map(loadImage));
        for (let i = 0; i < 4; i++) {
            ctx.drawImage(photoImgs[i], coords[i].x, coords[i].y, 840, 540);
        }

        // Use preloaded frame if available
        const frameImg = frameImageCache[selectedFrame] || await loadImage(selectedFrame);
        ctx.drawImage(frameImg, 0, 0, 1800, 1200);

        // Use toBlob() directly instead of toDataURL() -> fetch() -> blob() round-trip
        const blob = await new Promise(resolve => $hiddenCanvas.toBlob(resolve, 'image/jpeg', 0.92));
        const previewUrl = URL.createObjectURL(blob);
        $resultImg.src = previewUrl;

        showUploadOverlay('Uploading photo...');
        const publicUrl = await uploadToSupabase(blob);
        hideUploadOverlay();

        if (publicUrl) {
            $resultImg.dataset.publicUrl = publicUrl;
            QRCode.toCanvas($canvasQR, publicUrl, {
                width: 200, margin: 1,
                color: { dark: '#1E3A5F', light: '#ffffff' }
            });
        } else {
            QRCode.toCanvas($canvasQR, 'Upload failed - use download button', {
                width: 200, margin: 1
            });
        }

        // Store blob for download instead of data URL
        $resultImg._blob = blob;
        showScreen('screen-result');

        // Free session photo blob URLs
        sessionPhotos.forEach(url => URL.revokeObjectURL(url));
        sessionPhotos = [];
    }

    // ---- Supabase Upload ----
    async function uploadToSupabase(blob) {
        const fileName = `photo_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`;
        try {
            const { data, error } = await sb.storage
                .from(STORAGE_BUCKET)
                .upload(fileName, blob, {
                    contentType: 'image/jpeg',
                    cacheControl: '86400',
                    upsert: false
                });

            if (error) throw error;

            const { data: urlData, error: urlError } = await sb.storage
                .from(STORAGE_BUCKET)
                .createSignedUrl(data.path, 86400);

            if (urlError) throw urlError;

            return urlData.signedUrl;
        } catch (err) {
            console.error('Supabase upload failed:', err.message);
            return null;
        }
    }

    // ---- Upload Overlay ----
    function showUploadOverlay(msg) {
        $uploadStatus.textContent = msg;
        $uploadOverlay.classList.add('active');
    }
    function hideUploadOverlay() {
        $uploadOverlay.classList.remove('active');
    }

    // NOTE: Photo cleanup should be handled server-side (Supabase Edge Function / cron)
    // Never list/delete storage files from the client — it exposes the bucket contents.

    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });
    }

    // ---- Frame image preloading ----
    const frameImageCache = {};
    $frameCards.forEach(card => {
        const src = card.dataset.frame;
        if (src) {
            const img = new Image();
            img.onload = () => { frameImageCache[src] = img; };
            img.src = src;
        }
    });

    // ---- Download Button ----
    $btnDownload.addEventListener('click', () => {
        const blob = $resultImg._blob;
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `photos-${Date.now()}.jpg`;
        a.click();
        // Revoke after a short delay to ensure download starts
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    // ---- New Session ----
    $btnNewSession.addEventListener('click', () => {
        sessionPhotos.forEach(url => { if (typeof url === 'string' && url.startsWith('blob:')) URL.revokeObjectURL(url); });
        sessionPhotos = [];
        selectedFrame = null;
        $frameCards.forEach(c => c.classList.remove('selected'));
        $btnStartSession.classList.remove('ready');
        $frameOverlay.style.display = 'none';
        showScreen('screen-frames');
    });
</script>
</body>
</html>
